name: multipeer_bridge
description: Minimal SwiftPM-compatible MultipeerConnectivity bridge for peer-to-peer list sharing on iOS.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MultipeerBridgePlugin
